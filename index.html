<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="referrer" content="no-referrer" />
    <!-- inline empty favicon: avoids the browser firing /favicon.ico at the host root -->
    <link rel="icon" href="data:," />
    <!--
      CSP: the evaluation engine must be able to reach arbitrary user-configured
      AI endpoints, therefore connect-src is intentionally open. Everything else
      is locked down to same-origin to reduce the attack surface.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; font-src 'self' data:; connect-src *; worker-src 'self' blob:; object-src 'none'; base-uri 'self'"
    />
    <title>AI API 质量评测平台</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
